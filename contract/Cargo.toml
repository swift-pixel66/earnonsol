[package]
name = "earn-counter-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "An independent authority-controlled counter for Solana"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "=2.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
